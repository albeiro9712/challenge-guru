service: task-manager-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  environment:
    TASKS_TABLE: !Ref TasksTable
  apiGateway:
    apiKeys:
      - ${self:service}-${self:provider.stage}-key
    usagePlan:
      quota:
        limit: 100
        period: DAY
      throttle:
        burstLimit: 3
        rateLimit: 3

functions:
  - ${file(functions/createTask.yml)}
  - ${file(functions/listTasks.yml)}
  - ${file(functions/getTask.yml)}
  - ${file(functions/updateTask.yml)}
  - ${file(functions/deleteTask.yml)}

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - "@aws-sdk/*"
    target: node20
    platform: node
    concurrency: 10

resources:
  - ${file(resources/dynamodb.yml)}
